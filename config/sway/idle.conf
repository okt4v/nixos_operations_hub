### Idle and locking
# Locking always closes the vault first. `loginctl lock-session` (the lock
# key, `menu power`) triggers the `lock` line.
exec swayidle -w \
    timeout 600 'loginctl lock-session' \
    timeout 900 'swaymsg "output * power off"' resume 'swaymsg "output * power on"' \
    before-sleep 'vault close; swaylock -f -c 000000' \
    lock 'vault close; swaylock -f -c 000000'
