### Input configuration
input type:touchpad {
    dwt enabled
    tap enabled
    drag enabled
    drag_lock disabled
    natural_scroll enabled
    middle_emulation enabled
}

input type:keyboard {
    xkb_layout "de"
    xkb_options "caps:escape"
}

# Flat pointer acceleration: fixes floaty/laggy cursor and Roblox relative camera motion.
input type:pointer {
    accel_profile flat
    pointer_accel 0
}
