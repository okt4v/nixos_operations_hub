### Outputs
# Resolution, position and scale come from kanshi (config/kanshi/config).
# `current` is a symlink to the wallpaper of your choice in ~/med/img/wall.
output * bg ~/med/img/wall/current fill #1c1c1e
output * adaptive_sync on

# Preferred homes; a workspace falls back to any output when its own is absent.
workspace 1  output HDMI-A-1
workspace 2  output DP-8
workspace 3  output eDP-1
workspace 4  output HDMI-A-1
workspace 5  output DP-8
workspace 6  output eDP-1
workspace 7  output HDMI-A-1
workspace 8  output DP-8
workspace 9  output eDP-1
workspace 10 output HDMI-A-1
