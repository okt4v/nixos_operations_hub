### Startup
exec mako
exec kanshi
exec waybar
exec widgets watch
exec wl-paste --type text --watch cliphist store
# restore the power profile picked last session
exec sh -c 'p=$(cat ~/.cache/power-profile 2>/dev/null); [ -n "$p" ] && powerprofilesctl set "$p"'
exec ~/.config/sway/scripts/micmute-led-sync.sh
# phone link tray icon, when the feature `phone` is on
exec sh -c 'command -v kdeconnect-indicator >/dev/null && exec kdeconnect-indicator'
# night light, when the feature `nightlight` is on
exec sh -c 'command -v wlsunset >/dev/null && exec night on'
