### Window rules

# Sober (Roblox) — bypass compositor vsync for smooth input
for_window [class="Sober"] allow_tearing enable
for_window [app_id="org.vinegarhq.Sober"] allow_tearing enable

# Scratchpads (bin/pad): float, park in the scratchpad, then show, so the
# first key press already brings the window up
for_window [app_id="^pad-"] floating enable, resize set 1400 800, move scratchpad, scratchpad show
for_window [app_id="qalculate-gtk"] floating enable, move scratchpad, scratchpad show
for_window [app_id="org.keepassxc.KeePassXC"] floating enable, resize set 1200 800, move scratchpad, scratchpad show
for_window [class="Spotify"] floating enable, resize set 1400 800, move scratchpad, scratchpad show

# yazi file picker via xdg-desktop-portal-termfilechooser
for_window [app_id="termfilechooser"] floating enable, resize set 1200 800, move position center

# Keybindings viewer
for_window [app_id="keys"] floating enable

# Picture-in-Picture (YouTube pop-out, etc.) — float and stick to all workspaces
for_window [title="Picture-in-Picture"] floating enable, sticky enable
