### Key bindings
#
# Basics:
#
    bindsym $mod+Return exec $term
    bindsym $mod+q kill
    bindsym $mod+space exec $menu
    bindsym $mod+Shift+space exec menu
    floating_modifier $mod normal
    bindsym $mod+Shift+c reload
    bindsym $mod+Shift+e exec swaynag -t warning -m 'Exit sway?' -B 'Yes, exit' 'swaymsg exit'
#
# Moving around:
#
    bindsym $mod+$left focus left
    bindsym $mod+$down focus down
    bindsym $mod+$up focus up
    bindsym $mod+$right focus right
    bindsym $mod+Left focus left
    bindsym $mod+Down focus down
    bindsym $mod+Up focus up
    bindsym $mod+Right focus right

    bindsym $mod+Shift+$left move left
    bindsym $mod+Shift+$down move down
    bindsym $mod+Shift+$up move up
    bindsym $mod+Shift+$right move right
    bindsym $mod+Shift+Left move left
    bindsym $mod+Shift+Down move down
    bindsym $mod+Shift+Up move up
    bindsym $mod+Shift+Right move right
#
# Workspaces:
#
    bindsym $mod+1 workspace number 1
    bindsym $mod+2 workspace number 2
    bindsym $mod+3 workspace number 3
    bindsym $mod+4 workspace number 4
    bindsym $mod+5 workspace number 5
    bindsym $mod+6 workspace number 6
    bindsym $mod+7 workspace number 7
    bindsym $mod+8 workspace number 8
    bindsym $mod+9 workspace number 9
    bindsym $mod+0 workspace number 10

    bindsym $mod+Shift+1 move container to workspace number 1
    bindsym $mod+Shift+2 move container to workspace number 2
    bindsym $mod+Shift+3 move container to workspace number 3
    bindsym $mod+Shift+4 move container to workspace number 4
    bindsym $mod+Shift+5 move container to workspace number 5
    bindsym $mod+Shift+6 move container to workspace number 6
    bindsym $mod+Shift+7 move container to workspace number 7
    bindsym $mod+Shift+8 move container to workspace number 8
    bindsym $mod+Shift+9 move container to workspace number 9
    bindsym $mod+Shift+0 move container to workspace number 10
#
# Layout:
#
    bindsym $mod+b splith
    bindsym $mod+v splitv
    bindsym $mod+s layout stacking
    bindsym $mod+w layout tabbed
    bindsym $mod+e layout toggle split
    bindsym $mod+f fullscreen
    bindsym $mod+Shift+f floating toggle
    bindsym $mod+d focus mode_toggle
    bindsym $mod+a focus parent
#
# Scratchpad:
#
    bindsym $mod+Shift+minus move scratchpad
    bindsym $mod+minus scratchpad show
#
# Resize mode:
#
mode "resize" {
    bindsym $left resize shrink width 20px
    bindsym $down resize grow height 20px
    bindsym $up resize shrink height 20px
    bindsym $right resize grow width 20px
    bindsym Left resize shrink width 20px
    bindsym Down resize grow height 20px
    bindsym Up resize shrink height 20px
    bindsym Right resize grow width 20px
    bindsym Return mode "default"
    bindsym Escape mode "default"
}
bindsym $mod+r mode "resize"
#
# Move mode (floating windows):
#
mode "move" {
    bindsym $left  move left  20px
    bindsym $down  move down  20px
    bindsym $up    move up    20px
    bindsym $right move right 20px
    bindsym Left  move left  20px
    bindsym Down  move down  20px
    bindsym Up    move up    20px
    bindsym Right move right 20px
    bindsym Return mode "default"
    bindsym Escape mode "default"
}
bindsym $mod+Shift+r mode "move"
#
# Utilities:
#
    bindsym --locked XF86AudioMute exec pactl set-sink-mute \@DEFAULT_SINK@ toggle
    bindsym --locked XF86AudioLowerVolume exec pactl set-sink-volume \@DEFAULT_SINK@ -5%
    bindsym --locked XF86AudioRaiseVolume exec pactl set-sink-volume \@DEFAULT_SINK@ +5%
    bindsym --locked XF86AudioMicMute exec pactl set-source-mute \@DEFAULT_SOURCE@ toggle
    bindsym --locked XF86MonBrightnessDown exec brightnessctl set 5%-
    bindsym --locked XF86MonBrightnessUp exec brightnessctl set 5%+

    # Screenshots: region→edit→clipboard / full→file / region→file / screen→edit→clipboard
    bindsym Print exec sh -c 'grim -g "$(slurp)" - | swappy -f - -o - | wl-copy'
    bindsym Shift+Print exec sh -c 'grim ~/med/img/shot/$(date +%Y%m%d-%H%M%S).png'
    bindsym $mod+Print exec sh -c 'grim -g "$(slurp)" ~/med/img/shot/$(date +%Y%m%d-%H%M%S).png'
    bindsym Ctrl+Print exec ~/.config/sway/scripts/screenshot-screen.sh

    # Screen recording (toggle)
    bindsym $mod+F9 exec sh -c 'pkill -SIGINT wf-recorder || wf-recorder -f ~/med/vid/rec/$(date +%Y%m%d-%H%M%S).mp4'
    bindsym $mod+Shift+F9 exec sh -c 'pkill -SIGINT wf-recorder || wf-recorder -g "$(slurp)" -f ~/med/vid/rec/$(date +%Y%m%d-%H%M%S).mp4'

    # Scratchpads (bin/pad): first press starts the app, later presses toggle it
    bindsym $mod+grave  exec pad term
    bindsym $mod+Ctrl+n exec pad note
    bindsym $mod+Ctrl+c exec pad calc
    bindsym $mod+Ctrl+a exec pad agenda
    bindsym $mod+Ctrl+p exec pad pass
    bindsym $mod+Ctrl+m exec pad music

    # Hub: project jumper, quick capture, mode picker, light/dark
    bindsym $mod+p exec kitty pj
    bindsym $mod+n exec cap
    bindsym $mod+o exec mode
    bindsym $mod+t exec theme
    bindsym $mod+Shift+w exec widgets

    # Grab from screen (text, formula, QR, colour) and today's note
    bindsym $mod+g exec menu grab
    bindsym $mod+Ctrl+d exec kitty note daily
    bindsym $mod+Ctrl+f exec card
    bindsym $mod+F10 exec minutes
    bindsym $mod+F11 exec dictate
    bindsym $mod+Shift+n exec night
    bindsym $mod+Ctrl+e exec pad mail

    # Lock screen
    bindsym Mod1+Ctrl+l exec loginctl lock-session

    # Toggle cursor confinement to active monitor
    bindsym $mod+m exec ~/.config/sway/scripts/cursor-lock.sh

    # Cycle workspaces on current monitor
    bindsym $mod+Tab       exec ~/.config/sway/scripts/cycle-workspace.sh next
    bindsym $mod+Shift+Tab exec ~/.config/sway/scripts/cycle-workspace.sh prev

    # Three-finger swipe
    bindgesture swipe:3:left  workspace next
    bindgesture swipe:3:right workspace prev

    # Cycle windows on current workspace
    bindsym Mod1+Tab       focus next sibling
    bindsym Mod1+Shift+Tab focus prev sibling

    # Adjust window/kitty opacity
    bindsym $mod+Mod1+Up exec ~/.config/sway/scripts/opacity-control.sh increase
    bindsym $mod+Mod1+Down exec ~/.config/sway/scripts/opacity-control.sh decrease

    # Keybindings cheat sheet
    bindsym Mod1+Ctrl+k exec kitty --app-id keys keys

    # Clipboard history picker
    bindsym $mod+c exec cliphist list | fuzzel --dmenu | cliphist decode | wl-copy

    # App launchers (mirrored as icons in waybar)
    bindsym Mod1+Ctrl+1 exec zen-beta
    bindsym Mod1+Ctrl+2 exec onlyoffice-desktopeditors
    bindsym Mod1+Ctrl+3 exec thunderbird
    bindsym Mod1+Ctrl+4 exec $term -e btop
    bindsym Mod1+Ctrl+5 exec spotify
