### Key bindings (prefix: C-Space)
#
# Basics:
#
    unbind C-b
    set -g prefix C-Space
    bind C-Space send-prefix

    bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"
    bind c new-window -c "#{pane_current_path}"
    bind x kill-pane
#
# Project jumper in a popup:
#
    bind f display-popup -E -w 60% -h 60% pj
#
# Splits (vim mnemonics — | vertical bar splits, - horizontal):
#
    unbind '"'
    unbind %
    bind | split-window -h -c "#{pane_current_path}"
    bind - split-window -v -c "#{pane_current_path}"
#
# Pane navigation (hjkl):
#
    bind h select-pane -L
    bind j select-pane -D
    bind k select-pane -U
    bind l select-pane -R
#
# Seamless pane navigation without prefix (Alt+hjkl), like vim-tmux-navigator:
#
    bind -n M-h select-pane -L
    bind -n M-j select-pane -D
    bind -n M-k select-pane -U
    bind -n M-l select-pane -R
#
# Pane resizing (Shift+hjkl, repeatable):
#
    bind -r H resize-pane -L 5
    bind -r J resize-pane -D 5
    bind -r K resize-pane -U 5
    bind -r L resize-pane -R 5
#
# Window navigation (Alt+n/p, Alt+1-9):
#
    bind -n M-n next-window
    bind -n M-p previous-window
    bind -n M-1 select-window -t 1
    bind -n M-2 select-window -t 2
    bind -n M-3 select-window -t 3
    bind -n M-4 select-window -t 4
    bind -n M-5 select-window -t 5
#
# Copy mode — vi keys, yank to system clipboard via wl-copy:
#
    setw -g mode-keys vi
    bind Escape copy-mode
    bind p paste-buffer
    bind -T copy-mode-vi v send-keys -X begin-selection
    bind -T copy-mode-vi V send-keys -X select-line
    bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
    bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
    bind -T copy-mode-vi Escape send-keys -X cancel
