# aerc. Everything not set here is aerc's default (`man aerc-config`).
[general]
# accounts.conf holds no password (it comes from a command), so it may be
# an ordinary readable file in the repo.
unsafe-accounts-conf = true

[ui]
mouse-enabled = true
threading-enabled = true

[filters]
text/plain = colorize
text/html = html | colorize
