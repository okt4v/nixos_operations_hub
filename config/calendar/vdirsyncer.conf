# iCloud calendar -> ~/.local/share/cal, read by khal.
# Needs the sops secret `icloud` (an app-specific password from
# appleid.apple.com) and one interactive `vdirsyncer discover` after install.
[general]
status_path = "~/.local/state/vdirsyncer/"

[pair cal]
a = "local"
b = "icloud"
collections = ["from b"]
conflict_resolution = "b wins"

[storage local]
type = "filesystem"
path = "~/.local/share/cal/"
fileext = ".ics"

[storage icloud]
type = "caldav"
url = "https://caldav.icloud.com/"
username = "oktavianmayer@icloud.com"
password.fetch = ["command", "cat", "/run/secrets/icloud"]
