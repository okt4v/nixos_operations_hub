# Every push: evaluate all hosts + shellcheck. On main also: build the
# installer ISO (download it from the run's artifacts) and install it in a VM.
name: ci
on:
  push:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix flake check

  iso:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: ./bin/build-iso
      - uses: actions/upload-artifact@v4
        with:
          name: ophub-nixos-iso
          path: iso/*.iso
          compression-level: 0
          retention-days: 14

  install:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mode: [whole, dual, replace]
    steps:
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix shell nixpkgs#qemu nixpkgs#openssh -c ./bin/test-install ${{ matrix.mode }}
