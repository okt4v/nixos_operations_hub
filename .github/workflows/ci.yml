# Every push: evaluate all hosts + shellcheck. On main also: build the
# installer ISO (download it from the run's artifacts), install it in a VM
# four ways (one of them through the menus, by keystroke), and run
# `hub selftest` inside a dev-hub VM.
# Binary cache (optional): set the repository variable CACHIX_NAME and the
# secret CACHIX_AUTH_TOKEN, and every build here is pushed to that Cachix
# cache; hosts and the installer download from it (hub.cache in core.nix).
name: ci
on:
  push:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix flake check

  iso:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v15
        if: vars.CACHIX_NAME != ''
        with:
          name: ${{ vars.CACHIX_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: ./bin/build-iso
      - uses: actions/upload-artifact@v4
        with:
          name: ophub-nixos-iso
          path: iso/*.iso
          compression-level: 0
          retention-days: 14

  install:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mode: [whole, dual, replace, tui]
    steps:
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v15
        if: vars.CACHIX_NAME != ''
        with:
          name: ${{ vars.CACHIX_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix shell nixpkgs#qemu nixpkgs#openssh -c ./bin/test-install ${{ matrix.mode }}

  # the whole dev-hub system (~30 GB): room first, then boot it and run every tool
  tools:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v15
        if: vars.CACHIX_NAME != ''
        with:
          name: ${{ vars.CACHIX_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix shell nixpkgs#qemu nixpkgs#openssh -c ./bin/test-tools
